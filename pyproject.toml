[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mongo-bakery"
version = "0.3.0"
description = "This project aims to simplify the process of creating MongoDB documents for testing purposes."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "Roger Camargo", email = "huogerac@gmail.com"},
    {name = "Vicente Marçal", email = "vicente.marcal@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "blinker>=1.9.0",
    "faker>=36.1.1",
    "mongoengine>=0.20.0",
    "mongomock>=4.3.0",
    "pytest>=9.0.3",
]
keywords = [
    "MongoDB",
    "Mongoengine",
    "testing",
    "factory",
    "developer tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/mongo-bakery/mongo_bakery"
Repository = "https://github.com/mongo-bakery/mongo_bakery"
Documentation = "https://mongo-bakery.github.io/mongo_bakery/"
Issues = "https://github.com/mongo-bakery/mongo_bakery/issues"

[project.entry-points.pytest11]
mongo_bakery = "mongo_bakery.pytest_plugin"

[tool.hatch.version]
path = "mongo_bakery/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/mongo_bakery",
]

[dependency-groups]
dev = [
    "coverage>=7.0",
    "mypy>=2.3.0",
    "ruff>=0.9.6",
    "taskipy>=1.14.1",
]
docs = [
    "mkdocs-material>=9.6.4",
    "mkdocstrings>=0.28.1",
    "mkdocstrings-python>=1.16.0",
]

[tool.ruff.lint]
select = [
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "SIM", # flake8-simplify
    "I", # isort
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "D", # pydocstyle
    "UP", # pyupgrade
    "RUF100", # Unused noqa directive
]

ignore = ["B904", "E501", "S101", "D1", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = [
    "S",
]

[tool.ruff.lint.isort]
combine-as-imports=true
split-on-trailing-comma=true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-wrap-aliases=true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = "mongoengine.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = [
    "test*.py",
]

minversion = "6.0"
addopts = "-ra -q -vv"
testpaths = [
    "tests/*",
]

[tool.taskipy.tasks]
lint = 'uv run ruff check'
typecheck = 'uv run mypy mongo_bakery'
pre_test = 'task lint'
test = 'coverage run -m pytest'
post_test = 'coverage html'
docs = 'uv run --group docs mkdocs serve'
docs_build = 'uv run --group docs mkdocs build'
